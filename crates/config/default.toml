# gto-poker-bot default configuration.
# This file mirrors `Config::default()`. Copy it, edit, and load with `Config::load(path)`.
# Every value here is a tunable; the engine reads configuration, it does not hardcode it.

[solve]
# Chip resolution: integer chips per big blind. Chosen so bet sizes stay integer (10/20 game).
chip_per_bb = 20
# Convergence target as a fraction of the starting pot (0.0005 = 0.05% of pot, the intended
# sub-0.1% standard). A looser target measurably over-states per-hand betting frequencies.
target_exploit_pct_pot = 0.0005
# Hard cap on solve iterations.
max_iterations = 1000
print_progress = true

[solve.bet_tree]
# Label baked into spot keys so different trees never collide in the matrix.
bet_tree_id = "smoke-v0"
# Per street, per [OOP, IP]. Empty string = no sizes of that kind.
flop_bet_sizes = ["33%", "33%"]
turn_bet_sizes = ["50%", "50%"]
river_bet_sizes = ["50%", "50%"]
flop_raise_sizes = ["", ""]
turn_raise_sizes = ["", ""]
river_raise_sizes = ["", ""]
# turn_donk_sizes / river_donk_sizes are optional; omit for none.

[solve.abstraction]
use_compression = false
add_allin_threshold = 1.5
force_allin_threshold = 0.15
merging_threshold = 0.1
ram_ceiling_gb = 8.0

[stacks]
stack_depths_bb = [100, 50, 20]
default_stack_bb = 100

[rake]
rake_rate = 0.0
rake_cap = 0.0

[io]
out_dir = "out"
matrix_dir = "matrix"
# Hard wall-clock cap on one on-demand solve (Phase 3 solve server).
solve_timeout_secs = 300

[store]
use_zstd = true
zstd_level = 19

[trainer]
# Verdict bands for the Phase 4 trainer (EV-loss thresholds as fractions of the starting pot).
# Precedence: Correct (loss <= eps) > FineMix (freq >= floor AND loss <= minor max)
# > MinorLeak (loss <= minor max) > ClearLeak.
# correct_eps equals the solve convergence target: verdicts are honest to solve precision.
correct_eps_pct_pot = 0.0005
minor_leak_max_pct_pot = 0.02
mix_freq_floor = 0.10

[review]
# Phase 5 hand-history review.
max_fresh_solves_per_run = 25
min_sample_n = 10
z_threshold = 2.0
# D45 F5-tripwire: played-action EV may not beat the mix EV by more than this fraction of pot.
# 2% (not the 0.05% solve target): audit-measured legitimate gaps reach ~1.4% pot; F5-class
# violations are 30%+; 2% separates them without false-firing on good data.
ev_sanity_eps_pct_pot = 0.02
# Hero bet sizes map to a tree size only within this fraction of pot; else skipped.
hero_size_tolerance_pct_pot = 0.08
mix_floor = 0.10

[navigator]
# Game-tree navigator display gate + confidence tiers (D55). These are % of the starting pot
# (not fractions), matching the units the navigator reports dominance in.
#
# The reach-gate: a decision node is descendable only when its own worst unplayed-action
# dominance is at or below this. Solve quality is GLOBAL (root exploitability <= 0.05% of pot),
# not local: a low-reach subtree is trained far less than the root, so its local numbers can be
# wrong even though the solve as a whole converged. 5% is a deliberate coverage-for-marked-error
# trade over the stricter 1%: 1% is the purest honesty but gates off the bet / raise /
# check-raise exploration on dry, monotone and broadway boards - exactly the nodes the navigator
# exists to show. 5% admits them at the cost of displaying up to ~5% pot of local error. That is
# acceptable ONLY because every displayed node carries its own dominance as a visible confidence
# signal; it is not a natural cutoff (dominance is a continuous gradient, the only natural
# cluster being <= 0.1% of pot).
display_gate_pct_pot = 5.0
# Confidence tiers for the per-node indicator. At or below high = "high" (near the ~0.1% root
# solve quality); at or below fair = "fair"; above fair up to the gate = "marginal".
confidence_high_pct_pot = 0.5
confidence_fair_pct_pot = 2.0
