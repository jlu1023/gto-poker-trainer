# Authored heads-up preflop ranges (Phase 1).
#
# These are OUR data, authored from established HU GTO theory (HU BTN/SB opens very wide; BB defends
# wide), not lifted from any licensed chart pack. They are reasonable approximations sufficient for
# the curated benchmark; the postflop solve is robust to small preflop range-edge differences. Refine
# later. Tokens use standard notation accepted by both postflop-solver and rs_poker.
#
# Keyed [<node>.<stack_depth_bb>]. `oop` = the OOP postflop player (BB), `ip` = the IP postflop player
# (BTN). For a single-raised pot these are the ranges entering the flop: BB's calling range vs a BTN
# open (oop) and the BTN opening range that got called (ip).

[srp.100]
oop = "22+,A2s+,K4s+,Q6s+,J7s+,T7s+,97s+,86s+,75s+,64s+,54s,A7o+,K9o+,QTo+,JTo,T9o,98o"
ip  = "22+,A2s+,K2s+,Q3s+,J6s+,T6s+,96s+,85s+,75s+,64s+,53s+,43s,A2o+,K6o+,Q8o+,J8o+,T8o+,97o+,87o,76o"

[srp.50]
oop = "22+,A2s+,K6s+,Q8s+,J8s+,T8s+,97s+,86s+,76s,A8o+,K9o+,QTo+,JTo,T9o"
ip  = "22+,A2s+,K3s+,Q5s+,J7s+,T7s+,97s+,86s+,75s+,64s+,54s,A2o+,K8o+,Q9o+,J9o+,T9o,98o"
