# Authored heads-up preflop ranges (Phase 1; BB defend ranges re-authored after the SRP
# range audit - see the vault note "SRP range audit - advisory flag attribution").
#
# These are OUR data, authored from established HU GTO theory, not lifted from any licensed
# chart pack. Tokens use the postflop-solver notation; entries may carry fractional weights
# ("AA:0.25"), and groups are written NON-OVERLAPPING (one weight per class).
#
# BB defend construction (oop): the BB closes preflop getting 1.5:3.5 (30% raw) vs the 2.5x
# open, so the binding constraint is OOP realization, not raw odds. The TOP models the 3-bet
# mix (premiums enter the SRP flop range at reduced weight: AA/KK 0.25, QQ/AK 0.5, JJ/AQ
# 0.75) so the SRP-entering range is realistically de-weighted at the nut end. The BOTTOM
# carries the low-board coverage the audit found missing (low offsuit connectors, low suited
# gappers, weak Ax-offsuit) at partial weights - the genuine call/fold mixes. Weight grid is
# deliberately coarse: {1.0, 0.75, 0.5, 0.25}. Weighted totals: 100bb ~787.5/1326 = 59.4%
# continue; 50bb ~709/1326 = 53.5% (tempered to the band's low end because the authored BTN
# open it faces is tighter than typical HU opens).
#
# Keyed [<node>.<stack_depth_bb>]. `oop` = the OOP postflop player (BB), `ip` = the IP
# postflop player (BTN). For a single-raised pot these are the ranges entering the flop:
# BB's calling range vs a BTN open (oop) and the BTN opening range that got called (ip).

