# Authored heads-up preflop ranges (Phase 1; BB defend ranges re-authored after the SRP
# range audit - "SRP range audit: advisory flag attribution", in the author's notes).
#
# These are OUR data, authored from established HU GTO theory, not lifted from any licensed
# chart pack. Tokens use the postflop-solver notation; entries may carry fractional weights
# ("AA:0.25"), and groups are written NON-OVERLAPPING (one weight per class).
#
# BB defend construction (oop): the BB closes preflop getting 1.5:3.5 (30% raw) vs the 2.5x
# open, so the binding constraint is OOP realization, not raw odds. The TOP models the 3-bet
# mix (premiums enter the SRP flop range at reduced weight: AA/KK 0.25, QQ/AK 0.5, JJ/AQ
# 0.75) so the SRP-entering range is realistically de-weighted at the nut end. The BOTTOM
# carries the low-board coverage the audit found missing (low offsuit connectors, low suited
# gappers, weak Ax-offsuit) at partial weights - the genuine call/fold mixes. Weight grid is
# deliberately coarse: {1.0, 0.75, 0.5, 0.25}. Weighted totals: 100bb ~787.5/1326 = 59.4%
# continue; 50bb ~709/1326 = 53.5% (tempered to the band's low end because the authored BTN
# open it faces is tighter than typical HU opens).
#
# 3-bet / 4-bet construction (Phase 3bp): the SRP fractional weights RESERVED the 3-bet mix
# (AA SRP-calls 0.25 because it 3-bets 0.75), so the 3bp/4bp ranges SPEND that reservation
# and must reconcile per hand: srp_call_w + threebet_w <= 1, btn call3_w + fourbet_w <=
# open_w, fourbet-call_w <= threebet_w. All enforced by unit tests in gto-preflop before
# anything solves on these strings. Consequence stated honestly: because the committed SRP
# call range keeps the merged middle (TT-22, AJs, KQs...) at FULL call weight, the
# consistent BB 3-bet range is POLAR and small (~5% of hands: premium complements + budgeted
# bluffs), not the ~13% of merged HU constructions; total BB defend lands ~64% (100bb),
# inside the realistic vs-2.5x band. The bluff wing draws from the partial-weight bottom
# (blocker-rich weak offsuit Ax/Kx at 0.25, low suited gappers at 0.25 of their 0.5 budget).
#
# Geometry lives NEXT to the ranges so it cannot drift from them. Uniform HU law (pinned by
# tests): the last preflop raise-to R, flat-called, gives pot_bb = 2R and eff_stack_bb =
# depth - R. srp R=2.5; 3bp R=10 (100bb) / 9 (50bb); 4bp R=22 (100bb only - 50bb 4-bet pots
# are SPR ~0.75 jam-or-fold and are out of scope, the review envelope skips them precisely).
#
# Keyed [<node>.<stack_depth_bb>]. `oop` = the OOP postflop player (BB), `ip` = the IP
# postflop player (BTN). For a single-raised pot these are the ranges entering the flop:
# BB's calling range vs a BTN open (oop) and the BTN opening range that got called (ip).
# For 3bp: oop = the BB 3-bet range (arrives in full once BTN calls), ip = BTN's
# call-vs-3-bet slice. For 4bp: ip = BTN's 4-bet range (arrives in full once BB calls),
# oop = BB's call-vs-4-bet slice (the 5-bet-jam mass never reaches a flop).

[srp.100]
raise_to_bb = 2.5
pot_bb = 5.0
eff_stack_bb = 97.5
oop = "AA:0.25,KK:0.25,QQ:0.5,JJ:0.75,TT-22,AKs:0.5,AQs:0.75,AJs-A2s,KQs-K2s,QJs-Q2s,JTs-J6s,J5s-J2s:0.75,T9s-T6s,T5s-T4s:0.75,T3s-T2s:0.5,98s-96s,95s-92s:0.5,87s-85s,84s-82s:0.5,76s-75s,74s-73s:0.5,65s-64s,63s-62s:0.5,54s,53s-52s:0.5,43s:0.75,42s:0.5,32s:0.5,AKo:0.5,AQo:0.75,AJo-A7o,A6o-A2o:0.75,KQo-K9o,K8o-K5o:0.75,K4o-K2o:0.5,QJo-Q9o,Q8o-Q5o:0.5,Q4o-Q2o:0.25,JTo-J9o,J8o-J7o:0.5,J6o-J5o:0.25,T9o-T8o,T7o:0.75,98o,97o:0.75,96o:0.5,87o,86o:0.75,85o:0.5,76o,75o:0.5,65o:0.75,64o:0.5,54o:0.5"
ip  = "22+,A2s+,K2s+,Q3s+,J6s+,T6s+,96s+,85s+,75s+,64s+,53s+,43s,A2o+,K6o+,Q8o+,J8o+,T8o+,97o+,87o,76o"

