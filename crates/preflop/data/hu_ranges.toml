# BB 3-bet range (oop): value = the premium complements reserved by the SRP weights
# (AA/KK 0.75, QQ/AKs/AKo 0.5, JJ/AQs/AQo 0.25). Bluff wing at 100bb: blocker-rich weak
# offsuit Ax/Kx complements (0.25 each) + low suited gappers at 0.25 of their 0.5 budget
# (board coverage when called). ~65.5 weighted combos = 4.9%; value:bluff ~1:1.6 for the
# 4x sizing. BTN call-vs-3-bet (ip): pairs in full (set value at SPR 4.5), suited
# broadway/connected core, blocker aces partial; AA/KK/QQ/AK/A5s/A4s weights carve out the
# [4bp.100].ip 4-bet slice so call3 + 4bet == open exactly on those hands.
[3bp.100]
raise_to_bb = 10.0
pot_bb = 20.0
eff_stack_bb = 90.0
oop = "AA:0.75,KK:0.75,QQ:0.5,JJ:0.25,AKs:0.5,AQs:0.25,AKo:0.5,AQo:0.25,A6o-A2o:0.25,K8o-K5o:0.25,T3s-T2s:0.25,95s-92s:0.25,84s-82s:0.25,53s-52s:0.25,42s:0.25,32s:0.25"
ip  = "AA:0.25,KK:0.25,QQ:0.5,JJ-22,AKs:0.5,AQs-ATs,A9s-A6s:0.75,A5s:0.75,A4s:0.75,A3s-A2s:0.75,KQs-KTs,K9s-K8s:0.5,QJs-QTs,Q9s:0.75,JTs-J9s,T9s-T8s,98s-97s,87s-86s,76s-75s,65s-64s,54s,53s:0.5,43s:0.5,AKo:0.5,AQo,AJo:0.75,ATo:0.75,KQo:0.75,KJo:0.75,QJo:0.5,JTo:0.25"

# Shallower 3-bet (to 9bb, SPR ~2.3): same value complements, bluff wing trimmed to the
# blocker offsuit hands only (suited-gapper realization matters less at low SPR; jam-or-fold
# pressure matters more). ~52.5 weighted combos = 4.0%. No [4bp.50] exists, so the BTN
# call-vs-3-bet weights at 50bb are bounded by the open alone; the premium remainder
# (AA 0.75 etc.) is the implied preflop jam mass that never reaches a flop.
