# 4-bet pot, 100bb only. ip = the BTN 4-bet range (value QQ+/AK at the exact complements of
# its call-vs-3-bet weights, plus A5s/A4s blocker 4-bets at 0.25); it arrives in full when
# the BB calls. oop = the BB call-vs-4-bet slice of its 3-bet range (QQ/JJ/AK/AQs continue,
# AA/KK trap at 0.25 with the rest as the implied 5-bet jam; AQo and the suited bluffs
# fold). 22 vs 13.5 weighted combos at SPR ~1.77.
