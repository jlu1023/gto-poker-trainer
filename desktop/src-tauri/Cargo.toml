# GTO Lab desktop shell (Tauri v2). Deliberately OUTSIDE the engine workspace (root
# Cargo.toml excludes desktop/): Tauri's dependency tree and lockfile stay clear of the
# pinned-solver workspace, which remains byte-identical for the gates. Packaging only -
# no GTO logic lives here.
[package]
name = "gto-lab-desktop"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0"
publish = false

[features]
# Production builds MUST enable this, or tauri::generate_context! resolves the window to
# devUrl (http://localhost:5173) instead of embedding frontendDist (../../viz/dist), and
# the bare exe shows ERR_CONNECTION_REFUSED with no Vite running. tauri-build's build
# script sets cfg(dev) = !custom-protocol; `cargo build --release` alone does NOT enable
# it, so the canonical build (desktop/build-desktop.ps1) passes --features custom-protocol.
# Kept non-default so `tauri dev` (which wants devUrl) still works unchanged.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# the fail-loudly dialogs (matrix guard, squatted port, sidecar missing/unhealthy) use
# MessageBoxW directly: works pre-event-loop, no plugin or app handle needed
windows-sys = { version = "0.60", features = ["Win32_UI_WindowsAndMessaging"] }

[profile.release]
strip = true
