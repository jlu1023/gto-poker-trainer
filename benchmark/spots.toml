# Curated benchmark batch. The curated stored set IS the validation benchmark set:
# one list, not two. Spots are chosen for verifiability and texture coverage.
# Context: heads-up, BB out of position vs BTN in position. `pot_type` selects the preflop
# line ("srp" default / "3bp" / "4bp"; geometry + ranges from gto-preflop spot_inputs, tree
# from phase1.toml tree_for). Each row becomes a matrix entry keyed
# {depth}bb_{board}_flop_{tree_id}. The 3bp/4bp rows reuse SRP boards deliberately:
# cross-pot comparison on identical textures, and zero new boards for the gate registry.

[[spot]]
board = "Ks7h2c"          # dry rainbow high
stack_depth_bb = 100

[[spot]]
board = "9c5d3h"          # dry rainbow low
stack_depth_bb = 100

[[spot]]
board = "AcKhQd"          # broadway rainbow
stack_depth_bb = 50

[[spot]]
board = "Jc9h8c"          # two-tone (clubs), wet / connected
stack_depth_bb = 100

[[spot]]
board = "Kh9h4h"          # monotone hearts
stack_depth_bb = 100

[[spot]]
board = "7h7d2c"          # paired (sevens), rainbow
stack_depth_bb = 100

[[spot]]
board = "6c5d4h"          # low connected, rainbow
stack_depth_bb = 100

[[spot]]
board = "Qs8s5h"          # two-tone (spades)
stack_depth_bb = 50

[[spot]]
board = "8d6s3c"          # dry rainbow low-mid; de facto gate fixture (trainer CACHED_50,
stack_depth_bb = 50       # review + viz fixtures) - solved on demand in Phase 3, curated now

